[package]
name = "zastava"
version = "2.1.0-1"
description = "Zastava - AI Network Gateway & Privacy Guardian"
authors = ["Zastava Team"]
edition = "2024"

[lib]
name = "zastava_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
iana-time-zone = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# TLS to HTTPS entry nodes: reuse the rustls 0.23 + ring stack already pulled in by reqwest.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
ring = "0.17"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }

[features]
# Debug-only tray stress test (ZASTAVA_TRAY_STRESS=1). Never enabled in release builds.
tray-stress = []
# Lets integration tests (`tests/*.rs`, which link the lib without cfg(test)) call
# `sysproxy::force_os_dry_run()`. Enabled only through the self dev-dependency below.
test-support = []

[dev-dependencies]
zastava = { path = ".", features = ["test-support"] }
tempfile = "3"
# `tauri::test::mock_app`/MockRuntime for tests/updater_signature.rs (test builds only; no new crate).
tauri = { version = "2", features = ["test"] }
# Virtual time (`start_paused`) for the guard's TTL / audit-timeout tests; same crate, test-only feature.
tokio = { version = "1", features = ["test-util"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
