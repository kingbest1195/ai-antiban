name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Права по умолчанию минимальные; каждая job при необходимости повышает их сама.
permissions:
  contents: read

# Один конвейер на тег; параллельный пуш того же тега не должен прерывать публикацию.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write  # tauri-action создаёт черновик релиза и грузит ассеты
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build & typecheck
        run: pnpm build

      - name: Run Rust tests (all)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Load release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          body="$(sed "s/\${VERSION}/${VERSION}/g" .github/release-notes.md)"
          # A tag with a suffix (rc) is a prerelease: say so at the top of the notes.
          case "$VERSION" in
            *-*) body="$(printf '> **Пробная сборка (prerelease).** Для проверки перед релизом, не для массового обновления: автообновление её не предлагает.\n\n%s' "$body")" ;;
          esac
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo "$body"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Zastava ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  # Проверка черновика: набор ассетов, latest.json, minisign-подписи. Падение => релиз остаётся draft.
  verify:
    name: Verify release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # черновик релиза виден только токену с правом записи
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      # Необязательно: допустимые значения version через запятую, если версия в конфиге
      # отличается от тега (например тег v2.1.0-rc.1, версия 2.1.0-1 из-за ограничения MSI).
      VERIFY_VERSIONS: ${{ vars.RELEASE_VERIFY_VERSIONS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test of the verifier
        run: node --test scripts/*.test.mjs

      - name: Check draft / prerelease flags
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)"
          pre="$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)"
          want=false
          case "$TAG" in *-*) want=true ;; esac
          [ "$draft" = "true" ] || { echo "release $TAG is not a draft"; exit 1; }
          [ "$pre" = "$want" ] || { echo "isPrerelease=$pre, expected $want"; exit 1; }

      - name: Download draft assets and verify
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --tag "$TAG" --dl-dir "$RUNNER_TEMP/release-assets")
          # Tag v2.1.0-rc.1 is built from config version 2.1.0-1 (MSI needs a numeric
          # pre-release); accept both unless the repository variable says otherwise.
          if [ -z "${VERIFY_VERSIONS:-}" ]; then
            case "$TAG" in
              v*-rc.*) base="${TAG#v}"; VERIFY_VERSIONS="${base},${base%-rc.*}-${base##*-rc.}" ;;
            esac
          fi
          if [ -n "${VERIFY_VERSIONS:-}" ]; then args+=(--version "$VERIFY_VERSIONS"); fi
          node scripts/verify-release.mjs "${args[@]}"

  # Публикация только после зелёного verify.
  publish:
    name: Publish release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Publish (final tag becomes latest, RC stays prerelease)
        run: |
          set -euo pipefail
          case "$TAG" in
            *-*) gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --latest=false ;;
            *)   gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease=false --latest ;;
          esac
