name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Права по умолчанию минимальные; каждая job при необходимости повышает их сама.
permissions:
  contents: read

# Один конвейер на тег; параллельный пуш того же тега не должен прерывать публикацию.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write      # tauri-action создаёт черновик релиза и грузит ассеты
      actions: read        # SignPath.io читает загруженный workflow artifact
      id-token: write      # OIDC-токен для GitHub Build Provenance Attestation
      attestations: write  # публикация SLSA/provenance-аттестаций артефактов
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build & typecheck
        run: pnpm build

      - name: Run Rust tests (all)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Load release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          body="$(sed "s/\${VERSION}/${VERSION}/g" .github/release-notes.md)"
          # A tag with a suffix (rc) is a prerelease: say so at the top of the notes.
          case "$VERSION" in
            *-*) body="$(printf '> **Пробная сборка (prerelease).** Для проверки перед релизом, не для массового обновления: автообновление её не предлагает.\n\n%s' "$body")" ;;
          esac
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo "$body"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Zastava ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      # Bug #9: опциональная подпись Authenticode через SignPath.io OSS (активируется после верификации проекта).
      # 1) Загружаем Windows-инсталляторы как workflow artifact (без него SignPath падает).
      - name: Upload Windows installers for SignPath
        id: upload-windows-installers
        if: ${{ matrix.platform == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 1

      # 2) Отправляем артефакт в SignPath.io и скачиваем подписанные бинарники в signed-windows-installers/.
      - name: Sign Windows installers via SignPath.io OSS
        if: ${{ matrix.platform == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-windows-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-windows-installers

      # 3) Подменяем локальные бандлы подписанными, переподписываем minisign (.sig) и обновляем draft-релиз + latest.json.
      - name: Re-sign minisign & refresh draft release after SignPath
        if: ${{ matrix.platform == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          nsis_dir="src-tauri/target/release/bundle/nsis"
          msi_dir="src-tauri/target/release/bundle/msi"
          for f in "$nsis_dir"/*.exe "$msi_dir"/*.msi; do
            base="$(basename "$f")"
            signed="$(find signed-windows-installers -type f -name "$base" | head -n 1)"
            [ -n "$signed" ] || { echo "Missing signed artifact for $base"; exit 1; }
            cp -f "$signed" "$f"
            pnpm tauri signer sign "$f"
          done
          if [ "$IS_TAG" = "true" ]; then
            assets=()
            for f in "$nsis_dir"/*.exe "$nsis_dir"/*.exe.sig "$msi_dir"/*.msi "$msi_dir"/*.msi.sig; do
              assets+=("$f")
            done
            gh release upload "$TAG" "${assets[@]}" --repo "$REPO" --clobber
            tmp_dir="$(mktemp -d)"
            gh release download "$TAG" --repo "$REPO" --pattern "latest.json" --dir "$tmp_dir"
            EXE_SIG="$(cat "$nsis_dir"/*.exe.sig)"
            MSI_SIG="$(cat "$msi_dir"/*.msi.sig)"
            node -e '
              const fs = require("fs");
              const p = process.argv[1];
              const lj = JSON.parse(fs.readFileSync(p, "utf8"));
              if (lj.platforms?.["windows-x86_64"]) lj.platforms["windows-x86_64"].signature = process.env.MSI_SIG.trim();
              if (lj.platforms?.["windows-x86_64-msi"]) lj.platforms["windows-x86_64-msi"].signature = process.env.MSI_SIG.trim();
              if (lj.platforms?.["windows-x86_64-nsis"]) lj.platforms["windows-x86_64-nsis"].signature = process.env.EXE_SIG.trim();
              fs.writeFileSync(p, JSON.stringify(lj, null, 2));
            ' "$tmp_dir/latest.json"
            gh release upload "$TAG" "$tmp_dir/latest.json" --repo "$REPO" --clobber
            rm -rf "$tmp_dir"
          fi

      # Bug #9: SLSA Build Provenance Attestation для всех артефактов релиза (.dmg, .tar.gz, .exe, .msi).
      - name: Attest build provenance (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz

      - name: Attest build provenance (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Проверка черновика: набор ассетов, latest.json, minisign-подписи. Падение => релиз остаётся draft.
  verify:
    name: Verify release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # черновик релиза виден только токену с правом записи
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      # Необязательно: допустимые значения version через запятую, если версия в конфиге
      # отличается от тега (например тег v2.1.0-rc.1, версия 2.1.0-1 из-за ограничения MSI).
      VERIFY_VERSIONS: ${{ vars.RELEASE_VERIFY_VERSIONS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test of the verifier
        run: node --test scripts/*.test.mjs

      - name: Check draft / prerelease flags
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)"
          pre="$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)"
          want=false
          case "$TAG" in *-*) want=true ;; esac
          [ "$draft" = "true" ] || { echo "release $TAG is not a draft"; exit 1; }
          [ "$pre" = "$want" ] || { echo "isPrerelease=$pre, expected $want"; exit 1; }

      - name: Download draft assets and verify
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --tag "$TAG" --dl-dir "$RUNNER_TEMP/release-assets")
          # Tag v2.1.0-rc.1 is built from config version 2.1.0-1 (MSI needs a numeric
          # pre-release); accept both unless the repository variable says otherwise.
          if [ -z "${VERIFY_VERSIONS:-}" ]; then
            case "$TAG" in
              v*-rc.*) base="${TAG#v}"; VERIFY_VERSIONS="${base},${base%-rc.*}-${base##*-rc.}" ;;
            esac
          fi
          if [ -n "${VERIFY_VERSIONS:-}" ]; then args+=(--version "$VERIFY_VERSIONS"); fi
          node scripts/verify-release.mjs "${args[@]}"

  # Публикация только после зелёного verify.
  publish:
    name: Publish release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Publish (final tag becomes latest, RC stays prerelease)
        run: |
          set -euo pipefail
          case "$TAG" in
            *-*) gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --latest=false ;;
            *)   gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease=false --latest ;;
          esac
